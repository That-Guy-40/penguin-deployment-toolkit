# demo-ssh: one of the two roles bin/smoke deploys side by side. An SSH-only
# machine: key-only OpenSSH for an administrator (ops, SSHKEYS) and a plain
# user (carol, her own key), no Remote Desktop, no apps. post.cmd reports the
# disks Windows sees. See ../README.md for the keys.
USERS=users.txt
SSH=on
SSHKEYS=authorized_keys
FASTSTARTUP=off
POST=post.cmd
FILES=disks.ps1
