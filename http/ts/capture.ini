; capture.ini - what 70-capture leaves out of a captured image (DISM
; WimScript format): DISM's own default list, plus \pdt, which holds the WIM
; being written and the reference machine's own identity (id.cmd).
[ExclusionList]
\$ntfs.log
\hiberfil.sys
\pagefile.sys
\swapfile.sys
\System Volume Information
\RECYCLER
\$RECYCLE.BIN
\$Recycle.Bin
\Windows\CSC
\pdt

[CompressionExclusionList]
*.mp3
*.zip
*.cab
\WINDOWS\inf\*.pnf
